collector_name: 篠原
browser:
  user_data_dir: ./chrome_profile_tiktok
  headless: false
  viewport_width: 1280
  viewport_height: 900
  start_url: https://www.tiktok.com/
  startup_wait_sec: 15
  action_delay_sec: 1.0
  # 最大稼働時間(分)。0 以下で無制限(4_overnight_run.command の夜間運用前提)。
  # 単発で時間を区切りたい場合は 480 等の値を入れる。
  max_runtime_minutes: 0
openai:
  # コスト最適化: 大半は nano(最安) で判定、uncertain=true のときだけ mini に
  # エスカレーション。完全 mini と比べて大幅にコスト削減しつつ、ボーダーライン
  # ケースの品質はそのまま保つハイブリッド構成。
  primary_model: gpt-4o-mini
  fallback_model: gpt-4o-mini
  use_fallback_for_uncertain: true
  timeout_sec: 20
  max_output_tokens: 250
  image_detail: low
google_sheets:
  auth_mode: oauth
  oauth_client_json: ./credentials/oauth_client.json
  oauth_token_json: ./credentials/token.json
  service_account_json: ./credentials/service_account.json
  spreadsheet_id: 1nER3bldVQ88mDl8P-kR5wmHUPZMJQnn2LYxSvAGG250
  tabs:
    recommended: おすすめ
    blackband: 黒帯確認
    pending: AI未判定_保留
    skipped: 除外ログ
    ng_keywords: NGワード
  ng_keywords_cache_ttl_sec: 600
  # 黄色セル除外: yellow_excluded_tab のシートで yellow_excluded_start_row 行目以降に
  # 黄色背景セルを持つ行のユーザーIDを自動除外する(海外アカウント・なりすまし対策)。
  # タブ名を空文字にするか start_row を 0 にすると無効。
  yellow_excluded_tab: おすすめ
  yellow_excluded_start_row: 8358
  yellow_excluded_cache_ttl_sec: 3600
  # 採用書き込みのフォロワー帯振り分け。`tabs.recommended` (おすすめ) は履歴として
  # 残し、新規採用は follower_count に応じて下の帯域別タブに書く。半開区間 [min, max)。
  # 起動時にタブが無ければ自動作成 + ヘッダー設定。空 list にすると従来の単一タブ運用。
  # 2000 未満(fc < 2000)は帯域定義から外しているので、フォールバックで
  # 上の tabs.recommended(=「おすすめ」)タブにそのまま記入される。
  recommended_tab_ranges:
    - { min: 2000,  max: 5000,      name: "おすすめ2000-5000" }
    - { min: 5000,  max: 10000,     name: "おすすめ5000-10000" }
    - { min: 10000, max: 50000,     name: "おすすめ10000-50000" }
    - { min: 50000, max: 999999999, name: "おすすめ50000+" }
slack:
  enabled: false
  webhook_url: ''
rate:
  max_ai_calls_per_minute: 10
  target_writes_per_minute: 1
  rest_every_n_posts: 80
  rest_sec: 60
rules:
  max_followers: 2000
  min_followers: 0
  ng_keywords:
  - DM
  - ＤＭ
  - ディーエム
  - 独身
  - ゲーム
  - 歌詞動画
  - 弾き語り
  - 歌ってみた
  - アイドル
  - アニメ
  - 漫画
  - マンガ
  - ドラマ
  - 映画
  - 声優
  - まとめ
  - edit
  - edits
  - 推し
  - オタク
  - ヲタク
  - 実況
  - sekainoowari
  - セカオワ
  - ミセス
  - Mrs. GREEN APPLE
  underage_patterns:
  - 08
  - 09
  - '10'
  - '11'
  - '12'
  - '13'
  - '14'
  - '15'
  foreign_strict: true
blackband:
  send_to_ai: false
  top_bottom_dark_ratio_threshold: 0.2
  dark_pixel_threshold: 35
logging:
  sqlite_path: ./data/tiktok_collector.sqlite3
  screenshot_dir: ./data/screenshots

algorithm_feedback:
  # stealth モードでは「興味なし」明示発火を OFF にする。
  # 理由:
  #   1. mark_not_interested_current が動画右上の三点メニューを 6 座標
  #      で連続クリック試行 → 当たらないと動画本体クリックで pause/play
  #      が連発、画面上で明らかに不自然(検知材料)
  #   2. TikTok DOM の更新で当たらないケースが多発
  #      ([NEGATIVE_FEEDBACK_EXCLUDED_FAILED] が頻発)
  #   3. 早スワイプ(target=False / 非候補で短く視聴して次へ)で
  #      「興味なし」シグナルは十分伝わる(自然な人間挙動)
  enable_negative_feedback_for_excluded: false
  negative_feedback_once_per_account: true
  target_only_previous_excluded: true
  negative_feedback_min_interval_sec: 20

browser_stealth:
  # 1_launch_chrome.command が --remote-debugging-port=9222 で起動した実Chromeに接続する
  cdp_url: http://localhost:9222

# stealth 版アルゴ。候補性判定と like のみ。follow はしない。
algorithm_stealth:
  # 候補性判定: 過去採用済みでない & フォロワー数 < rules.max_followers のときだけ候補
  enable_candidacy_check: false
  # 候補のうち like_probability で like を発火(0.0〜1.0)
  # 候補(=フォロワー数判明+閾値未満)に対して強めに好意シグナルを送り、
  # TikTokおすすめが似た傾向のアカウントに偏るようにする。
  enable_like: true
  like_probability: 0.30
  # 連続 like を避けるための最小間隔(秒)
  like_min_interval_sec: 90
  # 過去採用 uid マップを Sheets から再取得する間隔(秒)。複数PC運用時、他PCの追記を取り込む。
  # 120 秒にすると、他 PC が「おすすめ」に書き込んだ uid を 2 分以内に拾える。
  # 結果として recheck パスでの AI 浪費 + Sheets 重複スキップが減る。
  uid_map_refresh_sec: 120
  # 同じ uid が N 回連続で出てきたら、まずリカバリ(ArrowUp→戻る→大きくスワイプ)を
  # uid ごとに stuck_recovery_max_attempts 回試行する。それでも抜けられなかったら
  # data/RESTART_CHROME を touch し、main.py を exit code 77 で終了させる。
  # 4_overnight_run.command が Chrome 全 kill → 再起動 → main.py 再開を上限なしでループ。
  # 10 → 5 に短縮: PAST_EXCLUDED_SKIP の連投で時間ロスする前に早めにリカバリ介入する。
  stuck_full_restart_threshold: 5
  # リカバリ最大試行回数(uid ごと)。これを超えたら Chrome 全再起動。
  stuck_recovery_max_attempts: 3
